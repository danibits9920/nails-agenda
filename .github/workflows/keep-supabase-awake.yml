# Supabase pausa los proyectos del plan gratuito tras 7 días sin actividad.
# Esta tarea hace una consulta pequeña a la base cada lunes para evitarlo.
name: Mantener Supabase activo

on:
  schedule:
    - cron: "0 12 * * 1" # lunes 12:00 UTC (≈ 9:00 en Santiago)
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Consultar la base
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            "$SUPABASE_URL/rest/v1/services?select=id&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY")
          echo "Respuesta: $code"
          test "$code" = "200"
